<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="ic-moon" viewBox="0 0 24 24"><path d="M20.5 14.6A8.6 8.6 0 1 1 9.4 3.5a7.1 7.1 0 0 0 11.1 11.1z"/></symbol>
  <symbol id="ic-undo" viewBox="0 0 24 24"><path d="M12.5 8c-2.6 0-4.9 1-6.7 2.6L2 7v9h9l-3.6-3.6A8 8 0 0 1 12.5 10.5c3.2 0 6 1.9 7.3 4.7l2.2-.9C20.3 10.7 16.8 8 12.5 8z"/></symbol>
  <symbol id="ic-history" viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l4 4 4-4H6a7 7 0 1 1 2.1 5l-1.4 1.4A9 9 0 1 0 13 3zm-1 5v5l4.3 2.5.8-1.3-3.6-2.1V8z"/></symbol>
  <symbol id="ic-menu" viewBox="0 0 24 24"><path d="M3 6h18v2.4H3zm0 5h18v2.4H3zm0 5h18v2.4H3z"/></symbol>
  <symbol id="ic-check" viewBox="0 0 24 24"><path d="M9.2 16.6 4.9 12.3l-1.9 1.9 6.2 6.2L21 8.6l-1.9-1.9z"/></symbol>
  <symbol id="ic-redo" viewBox="0 0 24 24"><g transform="translate(24 0) scale(-1 1)"><path d="M12.5 8c-2.6 0-4.9 1-6.7 2.6L2 7v9h9l-3.6-3.6A8 8 0 0 1 12.5 10.5c3.2 0 6 1.9 7.3 4.7l2.2-.9C20.3 10.7 16.8 8 12.5 8z"/></g></symbol>
  <symbol id="ic-list" viewBox="0 0 24 24"><path d="M4 5h2.5v2.5H4zm4.5.2H20v2.1H8.5zM4 10.8h2.5v2.5H4zm4.5.2H20v2.1H8.5zM4 16.5h2.5V19H4zm4.5.2H20v2.1H8.5z"/></symbol>
  <symbol id="ic-trophy" viewBox="0 0 24 24"><path d="M7 3h10v2h3v3a4 4 0 0 1-4 4h-.3A5 5 0 0 1 13 14.9V18h3v3H8v-3h3v-3.1A5 5 0 0 1 8.3 12H8a4 4 0 0 1-4-4V5h3zm0 4H6v1a2 2 0 0 0 1.2 1.8A5 5 0 0 1 7 8zm10 0v1c0 .6-.1 1.2-.2 1.8A2 2 0 0 0 18 8V7z"/></symbol>
  <symbol id="ic-sound" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zm12.5-.6a5 5 0 0 1 0 7.2l-1.4-1.4a3 3 0 0 0 0-4.4zm2.8-2.8a9 9 0 0 1 0 12.8l-1.4-1.4a7 7 0 0 0 0-10z"/></symbol>
  <symbol id="ic-chart" viewBox="0 0 24 24"><path d="M4 19h16v2H2V3h2zm2-3 4-5 3 3 5-7 1.6 1.2-6.4 8.9-3-3L7.6 17.3z"/></symbol>
  <symbol id="ic-help" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 17h-2v-2h2zm2.1-7.7-.9.9c-.7.7-1.2 1.3-1.2 2.8h-2v-.5c0-1.1.5-2.1 1.2-2.8l1.2-1.3a1.9 1.9 0 0 0 .6-1.4 2 2 0 0 0-4 0H8a4 4 0 0 1 8 0c0 .9-.4 1.7-.9 2.3z"/></symbol>
  <symbol id="ic-share" viewBox="0 0 24 24"><path d="M18 16a3 3 0 0 0-2.4 1.2l-6.8-3.4a3 3 0 0 0 0-1.6l6.8-3.4A3 3 0 1 0 15 7c0 .3 0 .5.1.8L8.3 11.2a3 3 0 1 0 0 3.6l6.8 3.4A3 3 0 1 0 18 16z"/></symbol>

<section id="setup" class="setup" hidden>
  <div class="wrap">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">♥</div>
      <div><h1>Hearts Table</h1><div class="sub">Score Hearts at the table. Lowest score wins.</div></div>
      <button type="button" class="ghost brand-help" id="setup-help" aria-label="How to play Hearts"><svg class="ic"><use href="#ic-help"/></svg>Rules</button>
    </div>
    <div class="sheet-card">
      <div class="kicker">Players <span class="muted" id="player-count-note"></span></div>
      <div id="roster-wrap" class="roster-wrap" hidden>
        <div class="field-label">Recent players: tap to add</div>
        <div id="roster" class="roster"></div>
      </div>
      <div id="setup-players" class="setup-players"></div>
      <button type="button" class="ghost wide" id="add-player">+ Add player</button>
      <p class="field-error" id="setup-error" role="alert"></p>
      <datalist id="roster-list"></datalist>

      <div class="kicker sp">Game</div>
      <div class="field-label">Game ends when someone reaches</div>
      <div class="chips" id="target-chips" role="group" aria-label="End score">
        <button type="button" data-target="50">50</button><button type="button" data-target="100">100</button>
        <label class="custom-target"><span class="sr">Custom end score</span><input id="setup-target" type="number" inputmode="numeric" min="10" max="1000" step="1" value="100"></label>
      </div>
      <label class="field"><span>First dealer</span><select id="setup-dealer"></select></label>
      <div class="field-label">Screen</div>
      <div class="seg" role="group" aria-label="Screen layout">
        <button type="button" id="layout-phone" aria-pressed="true">Pass the phone<small>Upright cards for everyone</small></button>
        <button type="button" id="layout-table" aria-pressed="false">Shared table<small>Lies flat, each side faces a player (4 players)</small></button>
      </div>

      <div class="kicker sp">House rules</div>
      <div class="preset-row"><select id="preset-select" aria-label="House rules preset"></select><button type="button" class="ghost" id="save-preset">Save as preset</button></div>
      <div class="field-label">If someone shoots the moon</div>
      <div class="seg" role="group" aria-label="Moon scoring">
        <button type="button" id="mode-add" aria-pressed="true">+26 to everyone else<small>Shooter scores 0</small></button>
        <button type="button" id="mode-sub" aria-pressed="false">−26 to the shooter<small>Others score 0; can go below 0</small></button>
      </div>
      <div class="rule-toggles">
        <button type="button" class="toggle wide" id="rule-spot" aria-pressed="false"><span><b>Spot hearts</b><small>♥2–♥10 = face value, J 11, Q 12, K 13, A 14; ♠Q 13 (117 a hand)</small></span><i></i></button>
        <button type="button" class="toggle wide" id="rule-jack" aria-pressed="false"><span><b>Jack of Diamonds −10</b><small>Omnibus: whoever takes the J♦ subtracts 10</small></span><i></i></button>
      </div>
      <label class="field"><span>Passing</span><select id="rule-pass">
        <option value="classic">Left, right, across, hold (3 or 5 players: left, right, hold)</option>
        <option value="nohold">Left, right, across, never a hold hand</option>
        <option value="none">No passing</option>
      </select></label>
      <button type="button" class="primary" id="start-btn">Start game</button>
      <button type="button" class="ghost wide" id="setup-history"><svg class="ic"><use href="#ic-trophy"/></svg> History and player stats <span id="setup-history-count" class="count"></span></button>
      <p class="wake-note" id="setup-wake"></p>
    </div>
  </div>
</section>

<main id="game" class="game" hidden></main>

<section id="scorecard" class="scorecard" hidden aria-labelledby="sc-title">
  <div class="wrap">
    <div class="hist-head">
      <button type="button" class="ghost" id="sc-back">Table</button>
      <h2 id="sc-title">Scorecard</h2>
      <span class="sc-clock" id="sc-clock"></span>
    </div>
    <div id="sc-recap" class="sc-recap" hidden></div>
    <div id="sc-body"></div>
  </div>
</section>

<div id="keypad" class="keypad-back" hidden>
  <div class="keypad" id="keypad-box" role="dialog" aria-modal="true" aria-labelledby="kp-title">
    <div class="kp-head"><span class="avatar" id="kp-avatar"></span><h2 id="kp-title"></h2><button type="button" class="ghost small" id="kp-close" aria-label="Close keypad">Close</button></div>
    <div class="kp-display"><output id="kp-display" aria-live="polite">?</output><div class="kp-hint" id="kp-hint"></div></div>
    <div class="kp-chips" id="kp-chips"></div>
    <div class="kp-grid" id="kp-grid"></div>
    <div class="kp-foot">
      <button type="button" class="ghost" id="kp-undo" hidden>Undo</button>
      <button type="button" class="danger" id="kp-clear">Clear</button>
      <button type="button" class="primary" id="kp-done">Done</button>
    </div>
  </div>
</div>

<section id="help" class="help" hidden aria-labelledby="help-title">
  <div class="help-card">
    <div class="help-steps" id="help-steps"></div>
    <div class="help-dots" id="help-dots"></div>
    <div class="row-actions"><button type="button" class="ghost" id="help-prev">Back</button><button type="button" class="primary" id="help-next">Next</button></div>
    <button type="button" class="link" id="help-skip">Skip</button>
  </div>
</section>

<section id="history" class="history" hidden aria-labelledby="history-title">
  <div class="wrap">
    <div class="hist-head">
      <button type="button" class="ghost" id="history-back">Back</button>
      <h2 id="history-title">History</h2>
      <span class="hist-mode" id="history-mode"></span>
    </div>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-games" aria-selected="true">Games</button>
      <button type="button" role="tab" id="tab-stats" aria-selected="false">Players</button>
    </div>
    <div id="history-body"></div>
  </div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
</section>

<section id="winner-screen" class="winner-screen" hidden aria-labelledby="ws-title">
  <canvas id="confetti" aria-hidden="true"></canvas>
  <div class="ws-card">
    <div class="ws-trophy" aria-hidden="true"><svg class="ic"><use href="#ic-trophy"/></svg></div>
    <h2 id="ws-title"></h2>
    <p id="ws-sub"></p>
    <p id="ws-moment" class="ws-moment"></p>
    <ol id="ws-standings" class="ws-standings"></ol>
    <button type="button" class="primary" id="ws-rematch">Rematch, same players and rules</button>
    <div class="row-actions">
      <button type="button" class="ghost" id="ws-share"><svg class="ic"><use href="#ic-share"/></svg> Share results</button>
      <button type="button" class="ghost" id="ws-sheet"><svg class="ic"><use href="#ic-chart"/></svg> Scorecard</button>
    </div>
    <div class="row-actions">
      <button type="button" class="ghost" id="ws-new">New game</button>
      <button type="button" class="ghost" id="ws-close">Back to table</button>
    </div>
  </div>
</section>

<div id="sheet" class="sheet" aria-hidden="true">
  <div class="wrap">
    <div class="sheet-head"><h2 id="sheet-title"></h2><button type="button" class="ghost" id="sheet-close">Close</button></div>
    <div id="sheet-body"></div>
  </div>
</div>

<div id="moon-stage" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toast-msg"></span><button type="button" id="toast-act" hidden></button></div>
<div class="modal-back" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal">
    <h2 id="modal-title"></h2>
    <div id="modal-body"></div>
    <div class="row-actions" id="modal-actions"></div>
  </div>
</div>
